<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>摄像头 · reBot 控制台</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
  <link rel="stylesheet" href="/static/css/style.css?v=3.5.4-20261114-22">
</head>
<body>
  <div id="shell"></div>
  <main id="page" class="page">
    <div id="camAlert" class="alert" role="alert"></div>
    <div class="section-toolbar">
      <div><h2>相机设备</h2><p>连接、预览和配置每一路相机</p></div>
      <div class="btn-row">
        <button class="btn subtle" id="btnDiscover" data-app-nofb>扫描设备</button>
        <button class="btn primary" id="btnAddCam" data-app-nofb>添加相机</button>
        <button class="btn primary" id="btnSaveCam" data-app-nofb hidden disabled>重试保存</button>
      </div>
    </div>
    <div class="section-toolbar">
      <div class="camera-summary"><span class="badge" id="camState">正在读取…</span><span class="save-state" id="saveState">配置自动保存</span></div>
      <div class="btn-row"><button class="btn subtle sm" id="btnPreviewAll" data-app-nofb>全部预览</button><button class="btn subtle sm" id="btnPauseAll" data-app-nofb>暂停全部</button></div>
    </div>
    <div class="camera-workspace" id="camGrid" aria-label="相机预览"></div>
    <details class="card advanced-settings">
      <summary>高级诊断与深度相机</summary>
      <p class="hint">多路 USB 相机建议使用 MJPG。预览按设备配置采集，网页最多显示 15 帧/秒；采集任务使用保存的帧率。</p>
      <div id="deviceReport" class="hint"></div>
      <h3>LeRobot SDK 扫描</h3>
      <p class="hint">SDK 扫描会暂停网页预览，详细输出可在顶部任务日志查看。</p>
      <div class="btn-row"><button class="btn subtle" id="btnScanOpencv">OpenCV</button><button class="btn subtle" id="btnScanRealsense">RealSense</button><button class="btn subtle" id="btnScanOrbbec">Orbbec</button></div>
      <h3>Orbbec SDK 抓图</h3>
      <p class="hint">UVC 彩色画面直接在上方添加相机；深度 SDK 抓图请先暂停该设备预览。</p>
      <div class="row"><div class="field"><label for="orbPwd">权限安装密码</label><input type="password" id="orbPwd" autocomplete="off"></div><div class="btn-row"><button class="btn subtle" id="btnOrbUdev">安装权限</button><button class="btn" id="btnOrbSnap">SDK 抓图</button></div></div>
      <div class="hint" id="orbHint"></div><img id="orbImg" hidden style="max-width:100%;border-radius:8px;margin-top:12px" alt="Orbbec SDK 彩色图像">
    </details>
    <dialog class="camera-dialog" id="cameraDialog" aria-labelledby="cameraDialogTitle">
      <form id="cameraForm">
        <h2 id="cameraDialogTitle">添加相机</h2>
        <div class="alert" id="dialogAlert" role="alert"></div>
        <div class="field"><label for="camName">相机名称</label><input id="camName" required maxlength="60" placeholder="例如：顶部 / 左腕 / 右腕"></div>
        <div class="field"><label for="devicePicker">已发现的视频设备</label><select id="devicePicker"></select><span class="hint">仅列出可以采集图像的节点，自动排除元数据节点。</span></div>
        <div class="field"><label for="camSource">设备编号或稳定路径</label><input id="camSource" required placeholder="/dev/video4 或 /dev/v4l/by-path/…"><span class="hint">稳定路径可避免重启或插拔后编号变化。</span></div>
        <div class="field"><label for="camPreset">分辨率预设</label><select id="camPreset"></select><span class="hint">选预设会自动填入宽高，也可手动输入任意分辨率。</span></div>
        <div class="row"><div class="field"><label for="camWidth">宽度</label><input id="camWidth" type="number" min="16" max="7680" required value="640"></div><div class="field"><label for="camHeight">高度</label><input id="camHeight" type="number" min="16" max="4320" required value="480"></div><div class="field"><label for="camFps">采集 FPS</label><input id="camFps" type="number" min="1" max="120" required value="30"></div></div>
        <div class="row"><div class="field"><label for="camType">后端</label><select id="camType"><option value="opencv">OpenCV · USB 彩色</option><option value="realsense">RealSense SDK</option><option value="orbbec">Orbbec SDK</option></select></div><div class="field"><label for="camFourcc">传输格式</label><input id="camFourcc" maxlength="4" minlength="4" required value="MJPG"></div></div>
        <label class="check"><input id="camPreview" type="checkbox" checked>打开本页时自动预览</label>
        <div class="btn-row dialog-actions"><button type="button" class="btn subtle" id="btnCancelCamera" data-app-nofb>关闭</button><button type="submit" class="btn primary" data-app-nofb>完成</button></div>
      </form>
    </dialog>
  </main>
  <script src="/static/js/common.js?v=3.5.4-20261114-22"></script>
  <script src="/static/js/autosave.js?v=3.5.4-20261114-22"></script>
  <script src="/static/js/camera.js?v=3.5.4-20261114-22"></script>
</body>
</html>
