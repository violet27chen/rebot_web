<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遥操作 · 机械臂控制台</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
  <link rel="stylesheet" href="/static/css/style.css?v=3.5.4-20261114-20-r2">
</head>
<body>
  <div id="shell"></div>
  <div id="page" class="page">
    <div id="telAlert" class="alert"></div>

    <div class="card">
      <div class="card-h"><h2>遥操作</h2><span class="sub">lerobot-teleoperate · 死循环在子进程中运行</span></div>
      <div class="btn-row">
        <button class="btn primary" id="btnTeleop">开始遥操作</button>
        <button class="btn danger" id="btnStop">停止遥操作</button>
      </div>
      <details class="device-parameters"><summary>已保存配置的遥操作命令</summary><pre class="command-preview" id="cmdPreview">正在生成命令预览…</pre></details>
      <div class="note" style="margin-top:10px">
        需先在「设备连接与校准」页面分别选择串口连接主从臂；未连接时后端会明确拒绝，不会静默执行。
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-h"><h2>异步推理</h2><span class="sub">policy_server / robot_client</span></div>
        <form id="asyncForm">
          <div class="row">
            <div class="field"><label>服务地址</label><input name="server_address"></div>
            <div class="field"><label>模型路径</label><select name="model_path"></select></div>
          </div>
          <div class="row" style="margin-top:10px">
            <div class="field"><label>actions_per_chunk</label><input name="actions_per_chunk" type="number"></div>
            <div class="field"><label>chunk_size_threshold</label><input name="chunk_size_threshold" type="number" step="0.1"></div>
            <div class="field"><label>fixed_update_fps</label><input name="fixed_update_fps" type="number"></div>
          </div>
          <div class="btn-row" style="margin-top:14px">
            <button class="btn subtle" type="submit">保存参数</button>
            <button class="btn primary" type="button" id="btnServer">启动服务端</button>
            <button class="btn" type="button" id="btnClient">启动客户端</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><h2>执行日志</h2>
        <span class="sub"><label class="check"><input type="checkbox" id="logAuto" checked> 自动滚动</label></span>
      </div>
      <div class="log" id="logPanel"></div>
    </div>
  </div>
  <script src="/static/js/common.js?v=3.5.4-20261114-20-r2"></script>
  <script src="/static/js/autosave.js?v=3.5.4-20261114-20-r2"></script>
  <script src="/static/js/teleop.js?v=3.5.4-20261114-20-r2"></script>
</body>
</html>
