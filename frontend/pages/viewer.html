<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据查看 · 机械臂控制台</title>
  <link rel="icon" href="/static/img/logo.svg">
  <link rel="stylesheet" href="/static/css/style.css?v=3.5.16-20261117-04">
</head>
<body>
  <div id="shell"></div>
  <div id="page" class="page">
    <div id="viewerAlert" class="alert"></div>

    <div class="card">
      <div class="card-h"><h2>选择数据集</h2><span class="sub">查看已录制剧集的相机画面与轨迹</span></div>
      <div class="row">
        <div class="field wide"><label>数据集</label><select id="vRepo"></select></div>
        <div class="field narrow"><label>剧集</label><select id="vEp"></select></div>
        <div class="btn-row">
          <button class="btn subtle" type="button" id="btnReload">刷新</button>
          <button class="btn subtle" type="button" id="btnExportViewerAll">一键导出数据+视频 (.zip)</button>
          <button class="btn subtle" type="button" id="btnExportViewerVid">仅导出视频 (.zip)</button>
          <button class="btn danger" type="button" id="btnDelEp">删除本集</button>
        </div>
      </div>
      <div class="hint" id="vMeta" style="margin-top:10px">选择数据集后加载</div>
    </div>

    <div class="card">
      <div class="card-h"><h2>相机画面 <span class="badge" id="vCameraCount">读取中…</span></h2><span class="sub" id="vTime"></span></div>
      <p class="hint">按本集实际录制的相机分别显示，共用播放、暂停与时间轴。实时深度画面只有录入数据集后才会出现在回放中。</p>
      <div id="videos" class="viewer-camera-grid"></div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn primary" type="button" id="btnPlay">播放</button>
        <button class="btn subtle" type="button" id="btnPause">暂停</button>
        <button class="btn subtle" type="button" id="btnRestart">回到开头</button>
      </div>
      <input id="vSeek" type="range" min="0" max="1000" value="0" style="width:100%;margin-top:10px">
    </div>

    <div class="card">
      <div class="card-h"><h2>状态与动作</h2><span class="sub">下采样曲线（纵轴自动缩放）</span></div>
      <canvas id="stateChart" style="width:100%;height:180px"></canvas>
      <canvas id="actionChart" style="width:100%;height:180px;margin-top:12px"></canvas>
    </div>
  </div>
  <script src="/static/js/common.js?v=3.5.16-20261117-04"></script>
  <script src="/static/js/autosave.js?v=3.5.16-20261117-04"></script>
  <script src="/static/js/viewer.js?v=3.5.16-20261117-04"></script>
</body>
</html>
